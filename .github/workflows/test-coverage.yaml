# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  workflow_dispatch:

name: Test/Covr

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # run every test, not only the quick ones (tests/testthat/helper.R)
      METACHECK_FULL_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: "4.5.1"

      - name: Install dependencies (with cache)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::plumber, any::logger
          needs: coverage
          cache: true
          cache-version: 1

      - name: Test coverage
        id: test
        run: |
          result <- tryCatch({
            cov <- covr::package_coverage(
              quiet = FALSE,
              clean = FALSE,
              install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
            )
            print(cov)
            covr::to_cobertura(cov)
            0
          }, error = function(e) {
            message("Tests failed, but continuing to produce partial coverage:")
            message(e)
            if (exists("cov")) {
              covr::to_cobertura(cov)
            }
            1
          })
          quit(status = result)
        shell: Rscript {0}
        continue-on-error: true

      # covr writes no coverage file when a test fails (package_coverage()
      # stops before returning), so only upload when there is one; the last
      # step reports the failed tests instead of a Codecov error
      - name: Upload coverage to Codecov
        if: always() && hashFiles('cobertura.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure() || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

      - name: Fail when tests failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::Tests failed; see 'Show testthat output' above for the failures"
          exit 1
        shell: bash
