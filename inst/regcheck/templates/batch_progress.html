<!doctype html>
<html lang="en" class="h-100" data-bs-theme="auto">
<head>
    {% set static_version = '20240519' %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include '_partials/head_assets.html' %}
    <title>RegCheck — Batch Progress</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        .state-pending  { color: #6c757d; }
        .state-running  { color: #0d6efd; }
        .state-success  { color: #198754; }
        .state-failed   { color: #dc3545; }
        .state-skipped  { color: #ffc107; }
        .batch-progress-wrap { max-width: 860px; margin: 0 auto; }
    </style>
</head>
{% set nav_active = 'tools' %}
<body class="d-flex text-center text-bg-dark page-shell">
  <div class="cover-container d-flex w-100 min-vh-100 p-3 mx-auto flex-column">
    <header class="mb-auto">
      {% include '_partials/navbar.html' %}
    </header>

    <main class="px-3 py-4 text-start">
      <div class="batch-progress-wrap">

        <h2 class="mb-1">Batch Progress</h2>
        <p class="text-secondary mb-3" id="status-text">Starting…</p>

        <div class="progress mb-4" style="height: 1.25rem;">
          <div class="progress-bar progress-bar-striped progress-bar-animated"
               id="progress-bar" role="progressbar"
               style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            0%
          </div>
        </div>

        <div class="table-responsive mb-4">
          <table class="table table-dark table-sm table-hover align-middle mb-0">
            <thead>
              <tr>
                <th class="text-secondary" style="width:2rem">#</th>
                <th>File</th>
                <th>NCT ID</th>
                <th style="width:8rem">Status</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="papers-tbody"></tbody>
          </table>
        </div>

        <div id="complete-actions" class="d-none d-flex gap-2">
          <a href="/batch_download/{{ batch_id }}" id="download-btn" class="btn btn-success">
            Download Results ZIP
          </a>
          <a href="/batch" class="btn btn-outline-secondary">New Batch</a>
        </div>

        <div id="running-actions">
          <a href="/batch" class="btn btn-outline-secondary btn-sm">New Batch</a>
        </div>

      </div>
    </main>
  </div>

  <script src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}?v={{ static_version }}"></script>
  <script>
    var batchId = "{{ batch_id }}";
    var pollTimer = null;

    var STATE_CLASS = {
      PENDING: 'state-pending',
      RUNNING: 'state-running',
      SUCCESS: 'state-success',
      FAILED:  'state-failed',
      SKIPPED: 'state-skipped'
    };

    var STATE_LABEL = {
      PENDING: 'Pending',
      RUNNING: 'Processing',
      SUCCESS: 'Done',
      FAILED:  'Failed',
      SKIPPED: 'Skipped (no NCT ID)'
    };

    function updateUI(data) {
      var total     = data.total     || 0;
      var completed = data.completed || 0;
      var failed    = data.failed    || 0;
      var done      = completed + failed;
      var pct       = total > 0 ? Math.round(done / total * 100) : 0;

      var bar = document.getElementById('progress-bar');
      bar.style.width   = pct + '%';
      bar.textContent   = pct + '%';
      bar.setAttribute('aria-valuenow', pct);

      var statusEl = document.getElementById('status-text');

      if (data.state === 'COMPLETE') {
        bar.classList.remove('progress-bar-animated');
        bar.style.width  = '100%';
        bar.textContent  = '100%';
        statusEl.textContent =
          'Done — ' + completed + ' succeeded, ' + failed +
          ' skipped/failed (out of ' + total + ' papers).';
        document.getElementById('complete-actions').classList.remove('d-none');
        document.getElementById('running-actions').classList.add('d-none');
        if (completed === 0) {
          document.getElementById('download-btn').classList.add('disabled');
        }
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

      } else if (data.state === 'RUNNING') {
        statusEl.textContent = 'Processing — ' + done + ' of ' + total + ' complete…';
      } else {
        statusEl.textContent = 'Queued, starting soon…';
      }

      var tbody = document.getElementById('papers-tbody');
      tbody.innerHTML = '';
      (data.papers || []).forEach(function(p, i) {
        var cls   = STATE_CLASS[p.state]  || '';
        var label = STATE_LABEL[p.state]  || p.state;
        tbody.insertAdjacentHTML('beforeend',
          '<tr>' +
          '<td class="text-secondary">' + (i + 1) + '</td>' +
          '<td class="font-monospace small text-break">' + escHtml(p.filename) + '</td>' +
          '<td class="font-monospace">'  + escHtml(p.nct_id || '—') + '</td>' +
          '<td class="' + cls + ' fw-semibold">' + label + '</td>' +
          '<td class="text-secondary small">' + escHtml(p.error || '') + '</td>' +
          '</tr>'
        );
      });
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function poll() {
      fetch('/batch_json/' + batchId)
        .then(function(r) { return r.json(); })
        .then(updateUI)
        .catch(function(err) { console.error('Poll error:', err); });
    }

    poll();
    pollTimer = setInterval(poll, 3000);
  </script>
</body>
</html>
